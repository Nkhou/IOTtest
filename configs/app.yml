apiVersion: apps/v1
kind: Deployment
metadata:
  name: nkhoudro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nkhoudro
  template:
    metadata:
      labels:
        app: nkhoudro
    spec:
      containers:
      - name: nkhoudro
        image: "wil42/playground:v2"
        ports:
        - containerPort: 8888

---
apiVersion: v1
kind: Service
metadata:
  name: nkhoudro
spec:
  selector:
    app: nkhoudro
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8888


---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nkhoudro
            port:
              number: 80